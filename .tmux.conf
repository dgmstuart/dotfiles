# Bindings
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix # C-a C-a to go to the beginning of the line
bind Escape copy-mode
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

set-window-option -g xterm-keys on # enable ctrl+left move by word etc

set -g mouse on

# Stop auto-renaming windows
setw -g automatic-rename off

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -L 5
bind -r h resize-pane -R 5

# Increase pane scrollback (default: 2000)
set -g history-limit 10000

# 24 hour clock
setw -g clock-mode-style 24

# Settings below this line are originally from https://github.com/chrishunt/dot-files/blob/master/.tmux.conf

# This should be default config:
bind-key w list-windows

# start window index at 1
set -g base-index 1

# start pane index at 1
setw -g pane-base-index 1

# highlight window when it has new activity
setw -g monitor-activity on
set -g visual-activity on

# re-number windows when one is closed
set -g renumber-windows on

# window splitting
bind | split-window -h
bind - split-window -v


###########################
# Status Bar
###########################

ROUNDED_START=""
ROUNDED_END=""
TERMINAL_ICON=""

# solarized colours
DARK_GREY="brightgreen"

# center the status bar
set -g status-justify left

# show session, window, pane and pomodoro in left status bar
set -g status-left-length 40
set -g status-left "\
 \
#[fg=green]${ROUNDED_START}#[default]\
#[bg=green,fg=black]${TERMINAL_ICON} #[default]\
#[bg=grey,fg=black] #{session_name}#[default]\
#[fg=grey]${ROUNDED_END}#[default]\
#{pomodoro_status} \
"

# show hostname, date, time and currently playing in right status bar
set -g status-right-length 100
set -g status-right "\
#[fg=blue]${ROUNDED_START}\
#[bg=blue,fg=black]♫ #[default]\
#[bg=${DARK_GREY},fg=white] #{music_status} #{track}#[default]\
#[fg=${DARK_GREY}]${ROUNDED_END}#[default] \
#[fg=green]#{host_short}#[default] \
#[fg=yellow]%H:%M#[default] \
%d/%m/%y \
"

set -g display-panes-active-colour yellow

set -g window-status-format "\
#[fg=blue]${ROUNDED_START}#[fg=default]\
#[bg=blue,fg=black]#I #[default]\
#[bg=grey,fg=black] #W#[default]\
#[fg=grey]${ROUNDED_END}#[fg=default]\
"

set -g window-status-current-format "\
#[bg=default]\
#[fg=yellow]${ROUNDED_START}#[fg=default]\
#[bg=yellow,fg=black]#I #[default]\
#[bg=grey,fg=black] #W#[default]\
#[fg=grey]${ROUNDED_END}#[fg=default]\
"

setw -g window-status-activity-style none
setw -g window-status-bell-style none

STOPWATCH=""
PAUSE=""
set -g @pomodoro_on "#[fg=red] ${ROUNDED_START}#[default]#[bg=red,fg=black]${STOPWATCH} #[default]#[fg=red] "
set -g @pomodoro_prompt_pomodoro "#[fg=yellow] START? ▶︎"
set -g @pomodoro_pause "#[fg=grey] ${ROUNDED_START}#[default]#[bg=grey,fg=black]${PAUSE} #[default]#[fg=grey] "
set -g @pomodoro_prompt_break "#[fg=green] ✔︎ [DONE]"
set -g @pomodoro_complete "#[fg=blue] [BREAK] "
set -g @pomodoro_disable_breaks 'on'
set -g @pomodoro_granularity 'on'
set -g status-interval 1 # to update the time
set -g @pomodoro_notifications 'on'
set -g @pomodoro_sound 'Glass'

###########################
# Colors
###########################

# Enable true-color (24-bit RGB) passthrough.
# Needed by termguicolors-based Neovim colorschemes (e.g. solarized.nvim).
# The old cterm-based solarized setup only needed 256-color support (screen-256color)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# color status bar
set -g status-style bg=black,fg=white

# set border color of active pane
set -g pane-border-style fg=colour235,bg=black
set -g pane-active-border-style fg=green,bg=black


###########################
# Plugins
###########################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'kdssoftware/tmux-tidal'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
